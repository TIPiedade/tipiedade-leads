<script>
/* Portal Ti'Piedade: armazenamento privado através do Worker (substitui o armazenamento do Claude) */
(function(){
  var W="https://tipiedade-crm.nameless-unit-fa2c.workers.dev";
  function sess(){ try{ var t=localStorage.getItem('crm_sess'), e=+(localStorage.getItem('crm_exp')||0); return (t&&e>Date.now())?t:null; }catch(x){ return null; } }
  window.__PORTAL={W:W, sess:sess};
  async function req(m,p,body){ var t=sess(); if(!t){ var er=new Error('Sessão do portal expirada — entra outra vez no portal.'); er.code='sessao'; throw er; }
    return fetch(W+p,{method:m,headers:{'Authorization':'Bearer '+t,'Content-Type':'application/json'},body:body,cache:'no-store'}); }
  var db={
    doc:function(path){ return {
      get: async function(){ var r=await req('GET','/kv/reuniao/'+path); if(r.status===404) return {exists:false,data:function(){return undefined;}}; if(!r.ok) throw new Error('HTTP '+r.status); var v=await r.json(); return {exists:true,data:function(){return v;}}; },
      set: async function(obj){ var r=await req('PUT','/kv/reuniao/'+path, JSON.stringify(obj)); if(!r.ok) throw new Error('HTTP '+r.status); }
    }; },
    collection:function(name){ return {
      get: async function(){ var r=await req('GET','/kvlist/reuniao/'+name+'/'); if(!r.ok) throw new Error('HTTP '+r.status); var arr=await r.json();
        return {docs:arr.map(function(x){ var v=JSON.parse(x.value); return {id:x.key.split('/').pop(), data:function(){return v;}}; })}; }
    }; }
  };
  var dl={ save: async function(o){ var blob=o.data instanceof Blob?o.data:new Blob([o.data]); var url=URL.createObjectURL(blob); var a=document.createElement('a'); a.href=url; a.download=o.filename; document.body.appendChild(a); a.click(); a.remove(); setTimeout(function(){URL.revokeObjectURL(url);},4000); } };
  window.claude={ use: async function(n){ return n==='db'?db : n==='downloads'?dl : null; } };
  if(!sess()) document.addEventListener('DOMContentLoaded',function(){ document.body.insertAdjacentHTML('afterbegin','<div style="background:#a3322e;color:#fff;padding:10px 16px;font:14px Inter,sans-serif">Sessão do portal expirada — volta ao portal e entra outra vez.</div>'); });
})();
</script>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ti'Piedade · Reunião comercial</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
:root{
  --brown-900:#231a17; --brown-800:#493631; --brown-600:#7a5c4f; --brown-300:#c4afa0;
  --bg:#fbf6f0; --surface:#ffffff; --surface-2:#f3e9dd; --line:#e7dbcd;
  --ink:#2e211d; --muted:#8a7a70;
  --accent:#c9702e; --accent-strong:#a95a20; --accent-soft:#f5decb;
  --ok:#5f8358; --ok-soft:#e3ecdf; --warn:#c98d2e; --warn-soft:#f5e9d1; --bad:#af3f3c; --bad-soft:#f6e0df;
  --display:'Fraunces', Georgia, 'Times New Roman', serif;
  --body:'Inter', -apple-system, 'Segoe UI', Roboto, sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#1c1512; --surface:#271e1a; --surface-2:#33271f; --line:#43342b;
    --ink:#f3e9dd; --muted:#b09d90;
    --accent:#e08a48; --accent-strong:#f0a46a; --accent-soft:#4a3222;
    --ok:#8fb487; --ok-soft:#27331f; --warn:#e0b060; --warn-soft:#3d3020; --bad:#e07a76; --bad-soft:#3e2221;
  }
}
:root[data-theme="dark"]{
  --bg:#1c1512; --surface:#271e1a; --surface-2:#33271f; --line:#43342b;
  --ink:#f3e9dd; --muted:#b09d90;
  --accent:#e08a48; --accent-strong:#f0a46a; --accent-soft:#4a3222;
  --ok:#8fb487; --ok-soft:#27331f; --warn:#e0b060; --warn-soft:#3d3020; --bad:#e07a76; --bad-soft:#3e2221;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--body);background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased;min-height:100vh;font-size:15px;line-height:1.45}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
.hidden{display:none!important}

/* top bar */
.top{background:linear-gradient(180deg,#493631 0%,#231a17 100%);color:#fbf6f0;padding:16px 28px;display:flex;align-items:center;gap:18px;flex-wrap:wrap}
.brand{font-family:var(--display);font-size:22px;font-weight:600;letter-spacing:.01em}
.brand small{display:block;font-family:var(--body);font-size:12.5px;font-weight:500;color:#e8cdb4;letter-spacing:0}
.top .spacer{flex:1}
.fresh{font-size:13px;color:#e8cdb4;text-align:right}
.fresh b{color:#fbf6f0;font-weight:600}
.anasel{display:inline-flex;gap:6px;align-items:center;margin-top:4px;font-size:12.5px;color:#e8cdb4}
.anasel select{background:rgba(255,255,255,.12);color:#fbf6f0;border:1px solid rgba(255,255,255,.3);border-radius:8px;padding:3px 6px;font-size:12.5px}
.anasel option{color:#2b1d18}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:8px 14px;font-weight:600;font-size:14px}
.btn:hover{border-color:var(--brown-300)}
.btn-primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn-primary:hover{background:var(--accent-strong);border-color:var(--accent-strong)}
.btn-top{background:rgba(255,255,255,.1);border-color:rgba(255,255,255,.25);color:#fbf6f0}
.btn-top:hover{background:rgba(255,255,255,.18);border-color:rgba(255,255,255,.4)}
.btn-sm{padding:5px 10px;font-size:13px;border-radius:8px}
.btn:disabled{opacity:.45;cursor:not-allowed}

/* steps */
.steps{display:flex;gap:4px;padding:0 28px;background:var(--surface);border-bottom:1px solid var(--line);overflow-x:auto}
.step{border:0;background:none;padding:14px 14px 12px;font-weight:600;color:var(--muted);border-bottom:3px solid transparent;white-space:nowrap;display:flex;gap:8px;align-items:center}
.step .n{width:22px;height:22px;border-radius:50%;border:1.5px solid currentColor;display:inline-grid;place-items:center;font-size:12px}
.step.on{color:var(--ink);border-bottom-color:var(--accent)}
.step.on .n{background:var(--accent);border-color:var(--accent);color:#fff}
.step.hist{margin-left:auto}

main{max-width:1180px;margin:0 auto;padding:26px 28px 80px}
h2{font-family:var(--display);font-size:28px;font-weight:600;line-height:1.15;margin-bottom:4px}
.lede{color:var(--muted);max-width:68ch;margin-bottom:20px}

.people{display:flex;gap:6px;margin-bottom:20px;flex-wrap:wrap}
.person{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 16px;font-weight:600;display:flex;gap:8px;align-items:center}
.person .cnt{font-size:12px;color:var(--muted);font-weight:500}
.person.on{background:var(--brown-800);border-color:var(--brown-800);color:#fbf6f0}
.person.on .cnt{color:#e8cdb4}

.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px}
.panel-h{padding:14px 18px;border-bottom:1px solid var(--line);display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.panel-h h3{font-family:var(--display);font-size:19px;font-weight:600}
.panel-h .meta{color:var(--muted);font-size:13px}
.panel-h .right{margin-left:auto}

.grid-obj{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:18px;align-items:start}
@media (max-width:900px){.grid-obj{grid-template-columns:1fr}}

/* commitment rows */
.item{display:grid;grid-template-columns:auto 1fr auto;gap:12px;padding:13px 18px;border-top:1px solid var(--line);align-items:start}
.item:first-child{border-top:0}
.kind{font-size:11.5px;font-weight:700;padding:3px 8px;border-radius:6px;white-space:nowrap;margin-top:2px}
.k-cobranca{background:var(--bad-soft);color:var(--bad)}
.k-reativacao{background:var(--warn-soft);color:var(--warn)}
.k-lead{background:var(--ok-soft);color:var(--ok)}
.k-recuperar{background:var(--accent-soft);color:var(--accent-strong)}
.k-mix{background:#e4e8f1;color:#4a5a80}
.table-wrap{overflow-x:auto}
.h2-range{font-family:var(--body);font-size:16px;font-weight:500;color:var(--muted);margin-left:8px;white-space:nowrap}
.note{padding:10px 18px 14px;font-size:12.5px;color:var(--muted);max-width:90ch}
.tsel{border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:5px 8px;width:100%}
.k-campanha{background:#f3e2f0;color:#8a3d7c}
.chart{width:100%;height:auto;display:block}
.chart text{font-family:var(--body);font-size:11px;fill:var(--muted)}
.kt td,.kt th{padding:9px 14px}
.legend{display:flex;gap:16px;font-size:12.5px;color:var(--muted);padding:0 18px 12px}
.legend i{display:inline-block;width:12px;height:3px;border-radius:2px;vertical-align:middle;margin-right:6px}
.form-row{display:grid;grid-template-columns:2fr 1fr 2fr 1fr 1fr 1fr;gap:10px;padding:16px 18px;align-items:end}
.form-row label{font-size:13px;font-weight:600;display:grid;gap:4px}
.form-row input,.form-row select{border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:8px 10px}
@media (max-width:800px){.form-row{grid-template-columns:1fr 1fr}}
:root[data-theme="dark"] .k-mix{background:#26304a;color:#aab8e0}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .k-mix{background:#26304a;color:#aab8e0}}
.kpis{display:flex;gap:28px;flex-wrap:wrap;margin:-6px 0 18px;padding:12px 18px;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
.kpis b{font-family:var(--display);font-size:24px;font-weight:600;display:block;line-height:1.1}
.kpis span{font-size:12.5px;color:var(--muted)}
.delta{font-weight:700}.delta.up{color:var(--ok)}.delta.down{color:var(--bad)}
.k-outro{background:var(--surface-2);color:var(--brown-600)}
.who{font-weight:600}
.code{color:var(--muted);font-weight:500;font-size:13px;margin-left:6px}
.facts{font-size:13px;color:var(--muted);margin-top:1px}
.item input.acao{width:100%;margin-top:7px;border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:6px 10px;font-size:14px}
.item input.acao::placeholder{color:var(--muted)}
.x{border:0;background:none;color:var(--muted);font-size:20px;line-height:1;padding:2px 6px;border-radius:6px}
.x:hover{color:var(--bad);background:var(--bad-soft)}

.empty{padding:28px 18px;color:var(--muted);text-align:center}
.empty b{display:block;color:var(--ink);font-family:var(--display);font-size:18px;margin-bottom:4px;font-weight:600}

/* suggestions */
.tabs{display:flex;flex-wrap:wrap;gap:2px;padding:8px 10px 0;border-bottom:1px solid var(--line)}
.tab{border:0;background:none;padding:8px 12px;font-weight:600;font-size:14px;color:var(--muted);border-bottom:2px solid transparent;white-space:nowrap}
.tab.on{color:var(--ink);border-bottom-color:var(--ink)}
.sug{display:grid;grid-template-columns:1fr auto;gap:10px;padding:10px 18px;border-top:1px solid var(--line);align-items:center}
.sug:first-child{border-top:0}
.sug .n1{font-weight:600;font-size:14px}
.sug .n2{font-size:12.5px;color:var(--muted)}
.add{border:1px solid var(--accent);color:var(--accent-strong);background:var(--surface);border-radius:8px;padding:4px 11px;font-weight:700;font-size:13px}
.add:hover{background:var(--accent-soft)}
.scroll{max-height:520px;overflow-y:auto}
.form{padding:16px 18px;display:grid;gap:10px}
.form label{font-size:13px;font-weight:600;display:grid;gap:4px}
.form input,.form select{border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:8px 10px;font-weight:400}

/* review */
.rv{display:grid;grid-template-columns:auto 1fr auto;gap:14px;padding:14px 18px;border-top:1px solid var(--line);align-items:start}
.rv:first-child{border-top:0}
.rv .evidence{font-size:13px;margin-top:3px}
.ev-ok{color:var(--ok)} .ev-part{color:var(--warn)} .ev-bad{color:var(--bad)} .ev-man{color:var(--muted)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:9px;overflow:hidden}
.seg button{border:0;background:var(--surface);padding:6px 11px;font-size:13px;font-weight:600;color:var(--muted);border-left:1px solid var(--line)}
.seg button:first-child{border-left:0}
.seg button.on.s-cumprido{background:var(--ok);color:#fff}
.seg button.on.s-parcial{background:var(--warn);color:#fff}
.seg button.on.s-nao{background:var(--bad);color:#fff}
.rv input.motivo{margin-top:8px;width:100%;border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:6px 10px;font-size:13.5px}
.auto-tag{font-size:11px;color:var(--muted);display:block;text-align:right;margin-top:4px}

.scoreline{display:flex;gap:28px;flex-wrap:wrap;padding:16px 18px;border-bottom:1px solid var(--line)}
.score .v{font-family:var(--display);font-size:30px;font-weight:600;line-height:1}
.score .l{font-size:12.5px;color:var(--muted);margin-top:4px}

/* close */
table{width:100%;border-collapse:collapse}
th,td{text-align:left;padding:10px 18px;border-top:1px solid var(--line);font-size:14px}
th{font-size:12.5px;color:var(--muted);font-weight:600;border-top:0}
td.r,th.r{text-align:right}
.out{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px;padding:16px 18px}
.out .card{border:1px solid var(--line);border-radius:12px;padding:14px;display:grid;gap:10px;background:var(--bg)}
.out .card b{font-family:var(--display);font-size:17px}
.out .card .row{display:flex;gap:6px;flex-wrap:wrap}
.lock{display:flex;gap:12px;align-items:center;padding:14px 18px;background:var(--ok-soft);color:var(--ok);border-radius:12px;margin-bottom:18px;font-weight:600;flex-wrap:wrap}
.lock .btn{margin-left:auto}
.warnbar{padding:12px 16px;border-radius:12px;background:var(--warn-soft);color:var(--ink);margin-bottom:18px;font-size:14px}
.warnbar b{color:var(--warn)}

/* history */
.hrow{display:grid;grid-template-columns:130px repeat(3,1fr) 110px;gap:14px;padding:12px 18px;border-top:1px solid var(--line);align-items:center;font-size:14px}
.hrow:first-child{border-top:0}
.hrow.head{font-size:12.5px;color:var(--muted);font-weight:600}
.bar{height:8px;background:var(--surface-2);border-radius:5px;overflow:hidden;margin-top:5px}
.bar i{display:block;height:100%;background:var(--ok);border-radius:5px}
@media (max-width:700px){.hrow{grid-template-columns:90px repeat(3,1fr)}.hrow .hide-sm{display:none}}

.search{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:12px 16px;font-size:15px;margin-bottom:16px}
.hbtn{width:100%;border:0;border-top:1px solid var(--line);background:none;text-align:left}
.hbtn:hover{background:var(--surface-2)}
/* upload overlay */
.drop{border:2px dashed var(--brown-300);border-radius:16px;padding:44px 24px;text-align:center;background:var(--surface);cursor:pointer}
.drop:hover,.drop.over{border-color:var(--accent);background:var(--accent-soft)}
.drop b{font-family:var(--display);font-size:22px;display:block;margin-bottom:6px;font-weight:600}
.drop p{color:var(--muted)}
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:var(--brown-900);color:#fbf6f0;padding:11px 18px;border-radius:10px;font-size:14px;font-weight:500;z-index:99;max-width:90vw}
.spinner{display:inline-block;width:14px;height:14px;border:2px solid currentColor;border-right-color:transparent;border-radius:50%;animation:spin .8s linear infinite;vertical-align:-2px;margin-right:6px}
@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.spinner{animation:none}}
textarea.wa{width:100%;min-height:160px;border:1px solid var(--line);border-radius:8px;padding:10px;font-size:13px;background:var(--surface)}
@media (max-width:640px){.top,.steps,main{padding-left:16px;padding-right:16px}.item,.rv{grid-template-columns:1fr auto}.item .kind,.rv .kind{grid-column:1/-1;justify-self:start}}
</style>
</head>
<body>

</nav>
<main id="main"></main>
<div class="toast hidden" id="toast"></div>

const fromIso = s => { const [y,m,d]=s.split('-').map(Number); return new Date(y,m-1,d); };

function semRange(s){ const d=fromIso(s); const seg=new Date(d); seg.setDate(d.getDate()-((d.getDay()+6)%7)); const dom=new Date(seg); dom.setDate(seg.getDate()+6);
  return seg.getMonth()===dom.getMonth() ? `${seg.getDate()} a ${dom.getDate()} ${MESES[dom.getMonth()]}` : `${seg.getDate()} ${MESES[seg.getMonth()]} a ${dom.getDate()} ${MESES[dom.getMonth()]}`; }

function toDate(v){
  if(v instanceof Date) return new Date(v.getFullYear(),v.getMonth(),v.getDate());
  if(typeof v==='number'){ const d=XLSX.SSF.parse_date_code(v); return d?new Date(d.y,d.m-1,d.d):null; }

}

/* ============ PERSISTENCE ============ */
let saveChain = Promise.resolve();
function save(path, data){
  if(!S.db) return Promise.resolve();
  saveChain = saveChain.then(()=>S.db.doc(path).set(JSON.parse(JSON.stringify(data)))).catch(e=>{
    console.error(e);
    toast(e && e.code==='quota_exceeded' ? 'Memória cheia: não foi possível guardar.' : 'Não foi possível guardar. Tenta outra vez.');
  });
  return saveChain;
}
let saveTimer=null;
function saveReuniaoSoon(){ clearTimeout(saveTimer); saveTimer=setTimeout(()=>save('reunioes/'+S.reuniao.id, S.reuniao), 700); }
function saveReuniaoNow(){ clearTimeout(saveTimer); return save('reunioes/'+S.reuniao.id, S.reuniao); }

// os documentos lidos da memória chegam congelados: trabalhar sempre numa cópia editável
const clone = x => JSON.parse(JSON.stringify(x));
async function loadAll(){
  if(!S.db){ S.ready=true; render(); return; }
  try{
    const [d, rs, cs, tp, ct, rl] = await Promise.all([ S.db.doc('dados/atual').get(), S.db.collection('reunioes').get(), S.db.collection('campanhas').get(), S.db.doc('config/tipos').get(), S.db.doc('config/contactos').get(), S.db.doc('dados/rel').get() ]);
    if(tp.exists) S.tipos = clone(tp.data().map||{});
    if(ct.exists) S.contactos = clone(ct.data().map||{});
    S.campanhas = cs.docs.map(x=>clone(x.data())).sort((a,b)=>a.inicio<b.inicio?-1:1);
    if(d.exists) S.dados = clone(d.data());
    if(S.dados && rl.exists && !S.dados.rel) S.dados.rel = clone(rl.data());
    const all = rs.docs.map(x=>clone(x.data())).sort((a,b)=>a.id<b.id?-1:1);
    S.historico = all.filter(r=>r.estado==='fechada');
    const hoje = iso(new Date());
    S.reuniao = all.find(r=>r.estado==='aberta') || null;
    if(!S.reuniao){
      const fechadaHoje = all.find(r=>r.id===hoje && r.estado==='fechada');
      if(fechadaHoje) S.reuniao = fechadaHoje;
    }
    pickAnterior();
  }catch(e){ console.error(e); toast('Não consegui ler a memória. Os dados desta sessão não ficam guardados.'); }
  if(S.reuniao&&S.reuniao.anaRef) S.anaRef=S.reuniao.anaRef;
  S.ready=true; render();
}
function pickAnterior(){
  const cur = S.reuniao ? S.reuniao.id : '9999';
  const prev = S.historico.filter(r=>r.id<cur);
  S.anterior = prev.length ? prev[prev.length-1] : null;
}
function ensureReuniao(){
  if(S.reuniao) return;
  const hoje = iso(new Date());
  S.reuniao = { id:hoje, data:hoje, estado:'aberta', objetivos:[], criadoEm:new Date().toISOString() };
  pickAnterior();
  saveReuniaoNow();
}

async function handleFile(file){
  $('#fresh').innerHTML='<span class="spinner"></span>A ler o ficheiro…';
  await new Promise(r=>setTimeout(r,30));
  try{
    const buf = await file.arrayBuffer();
    const names = XLSX.read(buf,{type:'array',bookSheets:true}).SheetNames;
    const find = k => names.find(n=>k.some(x=>n.toUpperCase().includes(x)));
    const sV = find(['VENDAS']), sK = find(['VENCIDO','PENDENTE']), sD = find(['DEVOLU']), sE = find(['PD_ENTREGA','ENTREGAS']);
    if(!sV||!sK) throw new Error('O ficheiro precisa das abas VENDAS e VENCIDOS. Abas encontradas: '+names.join(', '));
    $('#fresh').innerHTML='<span class="spinner"></span>A processar vendas…';
    await new Promise(r=>setTimeout(r,30));
    const wb = XLSX.read(buf,{type:'array',cellDates:true,dense:true,sheets:[sV,sK].concat(sD?[sD]:[]).concat(sE?[sE]:[])});
    const ents = sE ? XLSX.utils.sheet_to_json(wb.Sheets[sE],{header:1,raw:true,defval:null}) : [];
    const devs = sD ? XLSX.utils.sheet_to_json(wb.Sheets[sD],{header:1,raw:true,defval:null}) : [];
    const vend = XLSX.utils.sheet_to_json(wb.Sheets[sV],{header:1,raw:true,defval:null});
    const venc = XLSX.utils.sheet_to_json(wb.Sheets[sK],{header:1,raw:true,defval:null});
    const dados = aggregate(vend, venc, devs, ents);
    if(!dados.clientes.length) throw new Error('Não encontrei vendas dos comerciais nas séries configuradas.');
    S.dados = dados; _relKey='';
    const { rel, ...resto } = dados;
    await save('dados/atual', resto);
    await save('dados/rel', rel);
    render();
    toast('Dados atualizados até '+fmtDY(dados.ultimaVenda)+'.');
  }catch(e){
    console.error(e); renderFresh(); toast(e.message||'Não foi possível ler o ficheiro.',5000);
  }
}
function aggregate(vend, venc, devs, ents){
  const hoje = new Date(); const ref = new Date(hoje.getFullYear(),hoje.getMonth(),hoje.getDate());
  const refIso = iso(ref);

  for(let i=1;i<vend.length;i++){
    const r=vend[i]; if(!r||r.length<12) continue;
    const com = SERIES[String(r[3]??'').trim()]; if(!com) continue;
    const ent = String(r[6]??'').trim(); if(!ent) continue;
    const d = toDate(r[2]); if(!d) continue;
    if(!ultima||d>ultima) ultima=d;
    allRows.push([com, SERIES_GRP[String(r[3]).trim()]||'H', d, Number(r[11])||0, ent, String(r[3]).trim()+'|'+r[4]+'|'+r[5], String(r[9]??'').trim(), r[7]]);
    if(ent==='0005'){ pdRows.push([com,d,Number(r[11])||0,String(r[3]).trim()+'|'+r[4]+'|'+r[5]]); continue; }
    if(EXCL.has(ent)) continue;
    rows.push([com,ent,r[7],d,Number(r[11])||0,String(r[8]??'').trim(),r[9],SERIES_GRP[String(r[3]).trim()],Number(r[10])||0]);
  }

  const M = new Map(); const arts = {};

  const endMon = monOf(end); const curStart = back(endMon, 7*15); const lyStart = back(curStart,364), lyEnd = back(endMon,364);
  const W = {}; const w112 = back(end,112);
  const get = (com,ent,nome) => { const k=com+'|'+ent; let c=M.get(k); if(!c){ c={com,ent,nome:nome||'',ult:null,v365:0,v30:0,saldo:0,dias:0,docs:0,h:0,j:0,hab:0,rec:0,a12:new Set(),days:new Map(),al:{},first:null,dset:new Set(),mon:{},hAll:0,jAll:0}; M.set(k,c);} if(nome) c.nome=nome; return c; };
  for(const [com,ent,nome,d,v,art,desc,grp,q] of rows){
    const c = get(com,ent,nome);
    if(grp==='H'){
      const m=monOf(d); const cur = m>=curStart && m<=endMon, ly = m>=lyStart && m<=lyEnd;
      if(cur||ly){
        const k=iso(m); const wk = W[k]||(W[k]={}); const e = wk[com]||(wk[com]={v:0,cl:new Set(),a:{}});
        e.v+=v; e.cl.add(ent);
        if(cur && art){ const a=e.a[art]||(e.a[art]={q:0,cl:new Set(),f:0}); a.q+=q; a.cl.add(ent); if(v===0&&q>0) a.f+=q; if(!arts[art]) arts[art]=shortArt(desc); }
      }
      if(d>w112 && art && q>0){ const k=iso(d); if(!c.al[art]||c.al[art]<k) c.al[art]=k; }
    }
    if(!c.ult||d>c.ult) c.ult=d;
    if(!c.first||d<c.first) c.first=d;
    if(v>0) c.dset.add(iso(d));
    if(grp==='H') c.hAll+=v; else c.jAll+=v;
    if(d>back(end,730)){ const mk=d.getMonth(); c.mon[mk]=(c.mon[mk]||0)+v; }
    if(d>back(end,90)) v90c[com]=(v90c[com]||0)+v;
    if(d>=d365){ c.v365+=v; if(grp==='H') c.h+=v; else c.j+=v; }
    if(d>=d30) c.v30+=v;
    if(d>w6) c.rec+=v; else if(d>w26) c.hab+=v;
    if(d>w12 && art){ c.a12.add(art); if(!arts[art]) arts[art]=shortArt(desc); }
    if(d>w6){ const k=iso(d); const e=c.days.get(k)||{v:0,a:new Set()}; e.v+=v; if(art) e.a.add(art); c.days.set(k,e); }
  }

    const ds=[...c.dset].sort(); const lim=iso(w26); const d26=ds.filter(x=>x>lim);

    const tot=Object.values(c.mon).reduce((a,b)=>a+b,0); const ver=[5,6,7,8].reduce((a,m)=>a+(c.mon[m]||0),0);
    const saz = tot>=300 ? Math.round(ver/tot*100)/100 : null;
    clientes.push([c.com,c.ent,String(c.nome).slice(0,48),c.ult?iso(c.ult):null,r2(c.v365),r2(c.v30),r2(c.saldo),c.dias,c.docs,
      c.j>c.h?'J':'H', r2(c.hab/20), r2(c.rec/6), sk, [...c.a12].join('|'), recent, c.al, c.first?iso(c.first):null, intv, saz, d26.length]);
  });
  const coortes={}; const endIso=iso(end);

    const madura = days(endIso,f)>=180;
    const ativo = madura ? ds.some(x=>days(x,f)>=90 && days(x,f)<=180) : null;
    const k=(coortes[c.com]||(coortes[c.com]={})); const e=k[q]||(k[q]={n:0,voltou:0,ativo:0,maduros:0});

  });
  COMS.forEach(c=>{ receb[c].v90=r2(v90c[c]||0); receb[c].venc=r2(receb[c].venc); receb[c].peso=Math.round(receb[c].peso); receb[c].b=receb[c].b.map(r2); });
  const lojas={}, dv12={}; const e365=back(end,365), e182=back(end,182);
  let devAtual=null; try{ const h0=(devs&&devs[0])||[]; const ix=h0.findIndex(x=>String(x||'').toLowerCase().includes('atualizado')); if(ix>=0){ const dd=toDate(h0[ix+1]); if(dd) devAtual=iso(dd); } }catch(e){}
  const wEnd = devAtual ? fromIso(devAtual) : end, wStart = back(wEnd,365);
  // PD_entregas: fatura -> loja (só para cruzar)
  const entMap=new Map();
  const serial = x => { if(x instanceof Date) return Math.round((Date.UTC(x.getFullYear(),x.getMonth(),x.getDate(),x.getHours(),x.getMinutes(),x.getSeconds())-Date.UTC(1899,11,30))/86400000); const n=Number(x); return isFinite(n)?Math.round(n):null; };
  if(ents && ents.length>1){
    const hd=ents[0].map(x=>String(x||'').trim().toLowerCase());
    const col=n=>hd.findIndex(x=>x===n); const cT=col('tipodoc'), cS=col('série')>=0?col('série'):col('serie'), cN=col('numdoc'), cL=col('moradaaltentrega'), cNm=col('nome local entrega');
    if(cT>=0&&cS>=0&&cN>=0&&cL>=0){ for(let i=1;i<ents.length;i++){ const r=ents[i]; if(!r||r[cN]==null) continue; const k=String(r[cS]).trim()+'|'+String(r[cT]).trim()+'|'+serial(r[cN]); if(!entMap.has(k)) entMap.set(k,[Number(String(r[cL]).trim())||String(r[cL]).trim(), String(r[cNm]||'').trim()]); } }

    const [serie,tipo,num]=doc.split('|'); const m=entMap.get(serie+'|'+tipo+'|'+Math.round(Number(num)));
    if(d>e365) pdTot+=v; if(!m) return; if(d>e365) pdMatch+=v;
    const id=m[0]; const mapa=LOJAS_PD[id]; const L=vendLoja[id]||(vendLoja[id]={nome:mapa?mapa[2]:m[1], com:mapa?mapa[0]:com, v12:0, docs:new Set(), v6:0, vp:0, vW:0, ult:null});

  const L=semanasAtuais().filter(k=>!semanaParcial(k) && k<=lim).slice(-n); if(!L.length) return null;
  const agg = ks => { let v=0,cl=0; ks.forEach(k=>{ const x=wk(com,k); v+=x.v; cl+=x.cl; }); return {v:v/ks.length, cl:cl/ks.length, tk: cl? v/cl : 0}; };

const pct = (a,b) => b ? (a/b-1) : null;
const fmtPct = x => x==null ? '—' : (x>0?'+':'')+Math.round(x*100)+'%';
function foco(k){

  return {un, ofertas, esperadas, cl, semanas:ks.length, mediaDurante: ks.length? un/ks.length : 0, mediaAntes: before.length? unAntes/before.length : 0};
}
function campLabel(cp){ const n=parseInt(cp.mec)||5; return `Na compra de ${n} ${artNome(cp.art)}, oferta de 1 ${artNome(cp.oferta||cp.art)}`; }

/* ============ SUGGESTIONS ============ */
function sugestoes(com, tipo){
  if(!S.dados) return [];
  const ja = new Set((S.reuniao?.objetivos||[]).filter(o=>o.com===com).map(o=>o.ent));
  const list = S.dados.clientes.map(C).filter(c=>c.com===com && !ja.has(c.ent));
  if(tipo==='cobranca') return list.filter(c=>c.saldo>0.5&&c.dias>15).sort((a,b)=>b.saldo*Math.log(b.dias+1)-a.saldo*Math.log(a.dias+1)).slice(0,15);
  if(tipo==='recuperar') return emQueda(com).filter(c=>!ja.has(c.ent)).sort((a,b)=>(b.hab-b.rec)-(a.hab-a.rec)).slice(0,15);
  if(tipo==='ritmo') return foraDoRitmo(com).filter(c=>!ja.has(c.ent)).slice(0,15);
  if(tipo==='campanha'){ const cp=campanhaAtiva(); if(!cp) return []; return list.filter(c=>c.grp==='H'&&c.ult&&days(S.dados.ultimaVenda,c.ult)<=35&&!(c.al&&c.al[cp.art]&&c.al[cp.art]>=addD(S.dados.ultimaVenda,-84))).sort((a,b)=>b.v365-a.v365).slice(0,20); }
  if(tipo==='mix') return list.filter(c=>c.grp==='H'&&c.sk>=1&&c.sk<=2&&c.ult&&days(S.dados.ultimaVenda,c.ult)<=35&&c.v365>=500).sort((a,b)=>b.v365-a.v365).slice(0,15);
  if(tipo==='reativacao') return list.filter(c=>c.ult && c.saldo<=0.5).map(c=>({...c,inat:days(S.dados.ref,c.ult)})).filter(c=>c.inat>=45&&c.inat<=365&&c.v365>0).sort((a,b)=>b.v365-a.v365).slice(0,15);
  return [];
}
function sugLine(t,c){
  if(t==='cobranca') return eur(c.saldo)+' vencidos · '+c.dias+' dias · '+c.docs+' doc.';
  if(t==='reativacao') return c.inat+' dias sem comprar · '+eur0(c.v365)+' nos últimos 12 meses';
  if(t==='recuperar') return 'Habitual '+eur0(c.hab)+'/sem → agora '+eur0(c.rec)+'/sem ('+Math.round((c.rec/c.hab-1)*100)+'%)';
  if(t==='mix') return eur0(c.v365/52)+'/sem · só compra '+c.arts.map(artNome).join(', ');
  if(t==='ritmo') return 'Compra a cada '+c.intv+' dias · sem comprar há '+c.sem+' dias'+(c.saz!=null&&c.saz>=0.6?' · sazonal':'');
  if(t==='recuperar' && c.saz!=null && c.saz>=0.6) return 'Habitual '+eur0(c.hab)+'/sem → agora '+eur0(c.rec)+'/sem · sazonal (verão)';
  if(t==='campanha') return eur0(c.v365/52)+'/sem · não comprou este produto nas últimas 12 semanas';
  return '';
}
function transitaveis(com){
  if(!S.anterior) return [];
  const ja = new Set((S.reuniao?.objetivos||[]).filter(o=>o.com===com).map(o=>o.id));
  return S.anterior.objetivos.filter(o=>o.com===com && !ja.has(o.id)).map(o=>({o, r:avaliar(o, S.anterior)})).filter(x=>x.r.estado!=='cumprido');
}

/* ============ EVALUATION ============ */
function avaliar(o, reuniao){
  const man = reuniao.revisao && reuniao.revisao[o.id];
  const auto = autoAvaliar(o, reuniao);
  if(man && man.estado){ const manual = man.estado!==auto.estado; return {...auto, estado:man.estado, motivo:man.motivo||'', manual, ev: manual&&auto.estado ? 'Corrigido à mão (nos dados: '+auto.ev+')' : auto.ev}; }
  return {...auto, motivo:(man&&man.motivo)||''};
}
function autoAvaliar(o, reuniao){
  if(!S.dados) return {estado:null, ev:'Carrega os dados atuais para verificar.', cls:'ev-man', recebido:0, auto:false};
  if(S.dados.ultimaVenda && S.dados.ultimaVenda < reuniao.data) return {estado:null, ev:'Os dados são anteriores à reunião. Carrega um ficheiro mais recente.', cls:'ev-man', recebido:0, auto:false};
  const c = o.ent ? cliente(o.com,o.ent) : null;
  if(o.tipo==='cobranca'){
    const agora = c?c.saldo:0; const rec = Math.max(0,(o.ref||0)-agora);
    if(agora<=0.5) return {estado:'cumprido', ev:'Saldo vencido regularizado · '+eur(rec)+' recebidos', cls:'ev-ok', recebido:rec, auto:true};
    if(rec>0.5) return {estado:'parcial', ev:'Recebidos '+eur(rec)+' · ainda em dívida '+eur(agora), cls:'ev-part', recebido:rec, auto:true};
    return {estado:'nao', ev:'Sem pagamento · em dívida '+eur(agora), cls:'ev-bad', recebido:0, auto:true};
  }
  if(o.tipo==='recuperar'){
    if(!c) return {estado:'nao', ev:'Sem compras desde a reunião', cls:'ev-bad', recebido:0, auto:true};
    const s=vendasDesde(c,reuniao.data); const sem=Math.max(1,days(S.dados.ultimaVenda,reuniao.data)/7); const med=s.v/sem;
    const txt='Faturou '+eur0(s.v)+' desde a reunião ('+eur0(med)+'/semana; habitual '+eur0(o.ref)+')';
    if(med>=0.8*(o.ref||0)) return {estado:'cumprido', ev:txt, cls:'ev-ok', recebido:0, auto:true};
    if(s.v>0) return {estado:'parcial', ev:txt, cls:'ev-part', recebido:0, auto:true};
    return {estado:'nao', ev:'Sem compras desde a reunião · habitual '+eur0(o.ref)+'/semana', cls:'ev-bad', recebido:0, auto:true};
  }
  if(o.tipo==='campanha'){
    if(!c) return {estado:'nao', ev:'Sem compras desde a reunião', cls:'ev-bad', recebido:0, auto:true};
    const s=vendasDesde(c,reuniao.data);
    if(s.arts.includes(o.art)) return {estado:'cumprido', ev:'Comprou '+artNome(o.art)+' (campanha '+o.mec+')', cls:'ev-ok', recebido:0, auto:true};
    if(s.v>0) return {estado:'nao', ev:'Comprou '+eur0(s.v)+', mas não o produto da campanha', cls:'ev-bad', recebido:0, auto:true};
    return {estado:'nao', ev:'Sem compras desde a reunião', cls:'ev-bad', recebido:0, auto:true};
  }
  if(o.tipo==='mix'){
    if(!c) return {estado:'nao', ev:'Sem compras desde a reunião', cls:'ev-bad', recebido:0, auto:true};
    const s=vendasDesde(c,reuniao.data); const novas=s.arts.filter(a=>!(o.refs||[]).includes(a));
    if(novas.length) return {estado:'cumprido', ev:'Nova referência: '+novas.map(artNome).join(', '), cls:'ev-ok', recebido:0, auto:true};
    if(s.v>0) return {estado:'nao', ev:'Comprou '+eur0(s.v)+', mas só as referências habituais', cls:'ev-bad', recebido:0, auto:true};
    return {estado:'nao', ev:'Sem compras desde a reunião', cls:'ev-bad', recebido:0, auto:true};
  }
  if(o.tipo==='reativacao'){
    if(c && c.ult && c.ult>reuniao.data){ const s=vendasDesde(c,reuniao.data); return {estado:'cumprido', ev:'Voltou a comprar a '+fmtD(c.ult)+(s.v?' · '+eur0(s.v):''), cls:'ev-ok', recebido:0, auto:true, reativado:true}; }
    return {estado:'nao', ev:'Sem compras desde a reunião'+(c&&c.ult?' · última a '+fmtD(c.ult):''), cls:'ev-bad', recebido:0, auto:true};
  }
  if(o.tipo==='lead' && c && c.ult && c.ult>reuniao.data) return {estado:'cumprido', ev:'Já tem venda registada a '+fmtD(c.ult), cls:'ev-ok', recebido:0, auto:true};
  return {estado:null, ev:'Marca manualmente', cls:'ev-man', recebido:0, auto:false};
}
function resumoRevisao(reuniao, com){
  const obs = reuniao.objetivos.filter(o=>!com||o.com===com);
  let cump=0, parc=0, nao=0, pend=0, rec=0, reat=0;
  obs.forEach(o=>{ const r=avaliar(o,reuniao); if(r.estado==='cumprido')cump++; else if(r.estado==='parcial')parc++; else if(r.estado==='nao')nao++; else pend++; rec+=r.recebido||0; if((o.tipo==='reativacao'||o.tipo==='recuperar')&&r.estado==='cumprido')reat++; });
  const n=obs.length; const taxa = n? (cump+parc*0.5)/n : null;
  return {n,cump,parc,nao,pend,rec,reat,taxa};
}

function kpiStrip(com){

function svgChart(series, labels, opts){
  // series: [{vals:[], color, dash}] ; line chart, auto scale from 0
  const W=640,H=180,pl=40,pr=10,pt=10,pb=26; const n=labels.length;
  const mx=Math.max(1,...series.flatMap(s=>s.vals.filter(v=>v!=null)))*1.1;
  const x=i=>pl+(n<=1?0:i*(W-pl-pr)/(n-1)), y=v=>pt+(H-pt-pb)*(1-v/mx);
  const grid=[0,0.5,1].map(f=>{const v=mx*f/1.1*1; const yy=y(v); return `<line x1="${pl}" x2="${W-pr}" y1="${yy}" y2="${yy}" stroke="var(--line)"/><text x="${pl-6}" y="${yy+4}" text-anchor="end">${opts.fmt(v)}</text>`;}).join('');
  const lines=series.map(s=>{ const pts=s.vals.map((v,i)=>v==null?null:`${x(i)},${y(v)}`).filter(Boolean).join(' '); return `<polyline fill="none" stroke="${s.color}" stroke-width="${s.w||2.5}" ${s.dash?'stroke-dasharray="5 4"':''} points="${pts}"/>`+(s.dots?s.vals.map((v,i)=>v==null?'':`<circle cx="${x(i)}" cy="${y(v)}" r="3" fill="${s.color}"${s.partial&&i===n-1?' fill-opacity=".35"':''}/>`).join(''):''); }).join('');
  const xl=labels.map((l,i)=> (i%2===0||i===n-1)?`<text x="${x(i)}" y="${H-8}" text-anchor="middle">${l}</text>`:'').join('');
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="${opts.aria}">${grid}${lines}${xl}</svg>`;
}

function tipoCliente(c){ const m=S.tipos&&S.tipos[c.ent]; if(m) return m; for(const [t,rx] of TIPO_RX) if(rx.test(c.nome)) return t; return 'Outros'; }
function horecaAtivos(com,diasMax=84){ return S.dados.clientes.map(C).filter(c=>(com==='Equipa'||c.com===com)&&c.grp==='H'&&c.ult&&days(S.dados.ultimaVenda,c.ult)<=diasMax); }
function foraDoRitmo(com){ if(!S.dados||S.dados.v!==DADOS_V) return []; return S.dados.clientes.map(C).filter(c=>(com==='Equipa'||c.com===com)&&c.grp==='H'&&c.intv&&c.intv>=5&&c.ult).map(c=>({...c,sem:days(S.dados.ultimaVenda,c.ult)})).filter(c=>c.sem>1.5*c.intv&&c.sem>=10&&c.sem<=120).sort((a,b)=>b.v365-a.v365); }
let _mixCache=null, _mixKey='';
function mixPorTipo(){
  const key=S.dados.geradoEm+'|'+JSON.stringify(S.tipos||{}).length; if(_mixCache&&_mixKey===key) return _mixCache;
  const L=horecaAtivos('Equipa'); const T={};
  L.forEach(c=>{ const t=tipoCliente(c); const e=T[t]||(T[t]={n:0,sk:0,arts:{}}); e.n++; e.sk+=c.sk; c.arts.forEach(a=>e.arts[a]=(e.arts[a]||0)+1); });
  _mixCache=T; _mixKey=key; return T;
}
function sugestaoRef(c){ const t=tipoCliente(c); if(t==='Outros') return null; const T=mixPorTipo()[t]; if(!T||T.n<4) return null; const opts=Object.entries(T.arts).filter(([a])=>!c.arts.includes(a)).sort((x,y)=>y[1]-x[1]); if(!opts.length) return null; return {art:opts[0][0], pct:Math.round(opts[0][1]/T.n*100), tipo:t}; }
function abc(com){
  const L=S.dados.clientes.map(C).filter(c=>(com==='Equipa'||c.com===com)&&c.grp==='H'&&c.v365>0).sort((a,b)=>b.v365-a.v365);
  const tot=L.reduce((s,c)=>s+c.v365,0); let acc=0;
  L.forEach(c=>{ const antes=acc/tot; acc+=c.v365; c.cum=acc/tot; c.cls = antes < 0.8 ? 'A' : antes < 0.95 ? 'B' : 'C'; });
  return {L,tot};
}

    <p class="note">Um cliente novo com só 1 compra ao fim de algumas semanas é o primeiro a acompanhar. É a 2.ª compra que separa um teste de um cliente.</p>`;
  } else if(t==='receb'){

    body=`<div class="table-wrap"><table class="kt"><thead><tr><th>Comercial</th><th class="r">Vencido</th><th class="r">Atraso médio</th><th class="r">Dias de vendas em atraso</th><th class="r">0–30 d</th><th class="r">31–60 d</th><th class="r">61–90 d</th><th class="r">+90 d</th></tr></thead><tbody>

    <p class="note">O ficheiro não traz as datas de pagamento, por isso o prazo é medido pelo que está em atraso. O atraso médio é ponderado pelo valor. Os dias de vendas em atraso dizem quantos dias de faturação estão vencidos por receber.</p>
    <div class="panel-h" style="border-top:1px solid var(--line)"><h3>A comprar com dívida acima de 60 dias</h3><span class="meta">${risco.length} clientes · regra sugerida: sem crédito novo até regularizar</span></div>

    <div class="panel-h" style="border-top:1px solid var(--line)"><h3>Por loja</h3><span class="meta">últimos 6 meses face aos 6 anteriores</span></div>
    ${L.length?`<div class="table-wrap"><table class="kt"><thead><tr><th>Loja</th>${eq?'<th>Comercial</th>':''}<th class="r">Devoluções 6 m</th><th class="r">Valor 6 m</th><th class="r">Valor 6 m anteriores</th><th class="r">Em aberto</th></tr></thead><tbody>${L.slice(0,50).map(x=>`<tr><td><b>${esc(x.loja)}</b></td>${eq?`<td>${x.com}</td>`:''}<td class="r num">${x.n6}</td><td class="r num ${x.v6>x.vp*1.2&&x.v6>50?'ev-bad':''}">${eur0(x.v6)}</td><td class="r num">${eur0(x.vp)}</td><td class="r num">${x.ab||''}</td></tr>`).join('')}</tbody></table></div>`:'<div class="empty">Sem devoluções registadas.</div>'}

  }
  return `<h2>Análises</h2><p class="lede">Com base no último Dados.xlsx carregado (vendas até ${fmtDY(S.dados.ultimaVenda)}). HORECA, exceto Recebimentos e Devoluções.</p>

let tiposTimer=null;
function setTipo(ent,t){ S.tipos=S.tipos||{}; if(t==='Outros') delete S.tipos[ent]; else S.tipos[ent]=t; _mixCache=null; clearTimeout(tiposTimer); tiposTimer=setTimeout(()=>save('config/tipos',{map:S.tipos}),600); }

/* --- history --- */
function todasReunioes(){ const L=[...S.historico]; if(S.reuniao&&S.reuniao.estado!=='fechada') L.push(S.reuniao); return L.sort((a,b)=>a.id<b.id?-1:1); }
const norm = t => String(t||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase();
const estadoPill = e => e==='cumprido'?'<span class="ev-ok" style="font-weight:600">Cumprido</span>':e==='parcial'?'<span class="ev-part" style="font-weight:600">Parcial</span>':e==='nao'?'<span class="ev-bad" style="font-weight:600">Não cumprido</span>':'<span class="ev-man">Por rever</span>';
function estadoDe(o,r){ const rv=r.revisao&&r.revisao[o.id]; if(r.revisaoFechada&&rv) return {estado:rv.estado, motivo:rv.motivo||'', ev:rv.ev||''}; if(r.estado!=='fechada') return {estado:null,motivo:'',ev:'Reunião em curso'}; const e=avaliar(o,r); return {estado:r.revisaoFechada?e.estado:null, motivo:e.motivo, ev:r.revisaoFechada?e.ev:'Revisto na próxima reunião'}; }
function viewHistorico(){
  if(S.histSel) return viewReuniaoDetalhe(S.histSel);
  const all = todasReunioes();
  const bk = `<p style="display:flex;gap:8px;flex-wrap:wrap;margin:-4px 0 14px"><button class="btn btn-sm" data-act="exportarTudo">Exportar cópia de segurança</button><button class="btn btn-sm" data-act="importarTudo">Importar cópia</button><input type="file" id="fileBackup" accept=".json" class="hidden"></p>`;
  if(!all.length) return `<h2>Histórico</h2>${bk}<div class="panel"><div class="empty"><b>Ainda não há reuniões guardadas</b>A primeira aparece aqui assim que adicionares objetivos.</div></div>`;
  const H = all.filter(h=>h.resultado);
  const tot = COMS.map(c=>{ let n=0,t=0,rec=0; H.forEach(h=>{const x=h.resultado[c]; if(x&&x.n){n+=x.n;t+=x.taxa*x.n;rec+=x.rec;}}); return {c,taxa:n?t/n:null,rec}; });
  return `<h2>Histórico</h2>${bk}<p class="lede">Todas as reuniões ficam guardadas. Abre uma semana para ver o detalhe, ou pesquisa por cliente, código, ação ou motivo.</p>
  <input id="histQ" class="search" placeholder="Pesquisar cliente, código, ação ou motivo…" value="${esc(S.q||'')}" autocomplete="off">
  <div id="histBody">${histBody()}</div>
  ${H.length?`<div class="panel" style="margin-top:18px"><div class="scoreline">${tot.map(t=>`<div class="score"><div class="v num">${t.taxa==null?'—':Math.round(t.taxa*100)+'%'}</div><div class="l">${t.c} · média · ${eur0(t.rec)} recebidos</div></div>`).join('')}</div></div>`:''}`;
}
function histBody(){
  const all = todasReunioes();
  const q = norm(S.q).trim();
  if(q){
    const hits=[];
    [...all].reverse().forEach(r=>r.objetivos.forEach(o=>{ const e=estadoDe(o,r); if([o.nome,o.ent,o.acao,e.motivo,o.com,TIPO[o.tipo]].some(x=>norm(x).includes(q))) hits.push({r,o,e}); }));
    if(!hits.length) return `<div class="panel"><div class="empty"><b>Sem resultados</b>Nenhum objetivo com “${esc(S.q)}”.</div></div>`;
    return `<div class="panel"><div class="panel-h"><h3>${hits.length} resultado${hits.length>1?'s':''}</h3></div>${hits.map(({r,o,e})=>`<div class="rv">${kindTag(o.tipo)}<div><div class="who">${esc(o.nome)}${o.ent?`<span class="code">${esc(o.ent)}</span>`:''}</div><div class="facts">${o.com} · semana ${isoWeek(r.data)} (${fmtDY(r.data)})${o.acao?' · '+esc(o.acao):''}</div>${e.motivo?`<div class="facts">Motivo: ${esc(e.motivo)}</div>`:''}</div><div style="text-align:right">${estadoPill(e.estado)}<br><button class="btn btn-sm" style="margin-top:6px" data-open="${r.id}">Abrir reunião</button></div></div>`).join('')}</div>`;
  }
  const cell = x => x&&x.n ? `<div class="num">${x.cump}/${x.n} · ${Math.round(x.taxa*100)}%</div><div class="bar"><i style="width:${Math.round(x.taxa*100)}%"></i></div>` : '<span style="color:var(--muted)">—</span>';
  return `<div class="panel"><div class="hrow head"><div>Semana</div>${COMS.map(c=>`<div>${c}</div>`).join('')}<div class="hide-sm" style="text-align:right">Recebido</div></div>
  ${[...all].reverse().map(h=>`<button class="hrow hbtn" data-open="${h.id}"><div><b>Sem. ${isoWeek(h.data)}</b><div style="font-size:12.5px;color:var(--muted)">${semRange(h.data)}}${h.estado!=='fechada'?' · em curso':h.resultado?'':' · por rever'}</div></div>${COMS.map(c=>`<div>${h.resultado?cell(h.resultado[c]):`<span style="color:var(--muted)">${(n=>n===1?'1 objetivo':n+' objetivos')(h.objetivos.filter(o=>o.com===c).length)}</span>`}</div>`).join('')}<div class="hide-sm num" style="text-align:right">${h.resultado?eur0(COMS.reduce((s,c)=>s+((h.resultado[c]||{}).rec||0),0)):'—'}</div></button>`).join('')}</div>`;
}
function viewReuniaoDetalhe(id){
  const r = todasReunioes().find(x=>x.id===id);
  if(!r){ S.histSel=null; return viewHistorico(); }
  return `<p style="margin-bottom:12px"><button class="btn btn-sm" data-open="">← Voltar ao histórico</button></p>
  <h2>Semana ${isoWeek(r.data)} <span class="h2-range">${semRange(r.data)}</span></h2>
  <p class="lede">${r.estado!=='fechada'?'Reunião em curso.':r.resultado?'Revista na reunião de '+fmtDY(r.revistoEm)+'.':'Ainda por rever — será avaliada na próxima reunião.'}</p>
  ${COMS.map(c=>{ const obs=r.objetivos.filter(o=>o.com===c); const x=r.resultado&&r.resultado[c];
    return `<div class="panel" style="margin-bottom:16px"><div class="panel-h"><h3>${c}</h3><span class="meta num">${obs.length} objetivos${x&&x.n?' · '+x.cump+' cumpridos · '+eur0(x.rec)+' recebidos':''}</span>
    ${r.estado==='fechada'&&obs.length?`<span class="right"><button class="btn btn-sm" data-dl="${c}" data-rid="${r.id}">Descarregar HTML</button></span>`:''}</div>
    ${obs.length?obs.map(o=>{const e=estadoDe(o,r);return `<div class="rv">${kindTag(o.tipo)}<div><div class="who">${esc(o.nome)}${o.ent?`<span class="code">${esc(o.ent)}</span>`:''}</div>${factLine(o)?`<div class="facts num">${factLine(o)}</div>`:''}${o.acao?`<div class="facts">${esc(o.acao)}</div>`:''}${e.ev?`<div class="facts">${esc(e.ev)}</div>`:''}${e.motivo?`<div class="facts">Motivo: ${esc(e.motivo)}</div>`:''}</div><div>${estadoPill(e.estado)}</div></div>`}).join(''):'<div class="empty">Sem objetivos.</div>'}</div>`;}).join('')}
  ${r.estado==='fechada'?`<p style="text-align:right"><button class="btn btn-primary" data-dl="__rui" data-rid="${r.id}">Descarregar resumo da equipa</button></p>`:''}`;
}

/* ============ ACTIONS ============ */
function addFromClient(tipo, ent){
  if(tipo==='ritmo') tipo='recuperar';
  ensureReuniao();
  const c = cliente(S.com, ent); if(!c) return;
  if(S.reuniao.objetivos.filter(o=>o.com===S.com).length>=MAX_OBJ){ toast('Já tem '+MAX_OBJ+' objetivos. Remove um primeiro.'); return; }
  const o = { id:uid(), com:S.com, tipo, ent:c.ent, nome:c.nome, ref: tipo==='cobranca'?c.saldo:c.v365, dias: tipo==='cobranca'?c.dias:days(S.dados.ref,c.ult), ult:c.ult, acao:'' };
  if(tipo==='recuperar'){ o.ref=c.hab>=5?c.hab:c.v365/52; o.base=c.rec; }
  if(tipo==='mix'){ o.refs=c.arts; o.ref=c.v365/52; }
  if(tipo==='campanha'){ const cp=campanhaAtiva(); o.art=cp.art; o.oferta=cp.oferta||cp.art; o.camp=cp.id; o.mec=cp.mec; o.ref=c.v365/52; }
  S.reuniao.objetivos.push(o);
  saveReuniaoSoon(); render();
}
function addLead(){
  const nome=$('#fNome').value.trim(); if(!nome){ toast('Escreve o nome do cliente.'); return; }
  ensureReuniao();
  if(S.reuniao.objetivos.filter(o=>o.com===S.com).length>=MAX_OBJ){ toast('Já tem '+MAX_OBJ+' objetivos. Remove um primeiro.'); return; }
  const match = S.dados.clientes.map(C).find(c=>c.com===S.com && c.nome.toLowerCase()===nome.toLowerCase());
  S.reuniao.objetivos.push({ id:uid(), com:S.com, tipo:$('#fTipo').value, ent:match?match.ent:'', nome, ref:0, dias:0, acao:$('#fAcao').value.trim() });
  saveReuniaoSoon(); render(); toast('Objetivo adicionado.');
}
function carry(id){
  ensureReuniao();
  const o = S.anterior.objetivos.find(x=>x.id===id); if(!o) return;
  if(S.reuniao.objetivos.filter(x=>x.com===S.com).length>=MAX_OBJ){ toast('Já tem '+MAX_OBJ+' objetivos. Remove um primeiro.'); return; }
  const c = o.ent ? cliente(o.com,o.ent) : null;
  const n = {...o, id:uid(), transitado:true, origem:o.id};
  if(c && o.tipo==='cobranca'){ n.ref=c.saldo; n.dias=c.dias; }
  if(c && o.tipo==='reativacao' && c.ult){ n.dias=days(S.dados.ref,c.ult); }
  S.reuniao.objetivos.push(n); saveReuniaoSoon(); render();
}
function setRev(id, st){
  const a=S.anterior; if(!a) return;
  a.revisao = a.revisao||{};
  const auto = autoAvaliar(a.objetivos.find(o=>o.id===id), a);
  const cur = a.revisao[id]||{};
  a.revisao[id] = {...cur, estado:st, auto: auto.estado===st};
  save('reunioes/'+a.id, a); render();
}
let motivoTimer=null;
function setMotivo(id, txt){
  const a=S.anterior; if(!a) return;
  a.revisao=a.revisao||{};
  const cur=a.revisao[id]; 
  if(!cur||!cur.estado){ const e=autoAvaliar(a.objetivos.find(o=>o.id===id),a); a.revisao[id]={estado:e.estado,auto:true,motivo:txt}; }
  else cur.motivo=txt;
  clearTimeout(motivoTimer); motivoTimer=setTimeout(()=>save('reunioes/'+a.id,a),800);
}
async function fecharReuniao(forcar){
  const r=S.reuniao;
  const semAcao = r.objetivos.filter(o=>!o.acao).length;
  if(semAcao && !forcar){ S.confirmFechar=true; render(); const el=document.getElementById('confFechar'); if(el) el.scrollIntoView({behavior:'smooth',block:'center'}); return; }
  S.confirmFechar=false;
  try{
  if(S.anterior){
    const a=S.anterior; a.revisao=a.revisao||{};
    a.objetivos.forEach(o=>{ const e=avaliar(o,a); a.revisao[o.id]={...(a.revisao[o.id]||{}), estado:e.estado, recebido:e.recebido||0, ev:e.ev, auto:a.revisao[o.id]?a.revisao[o.id].auto:!!e.auto}; });
    a.resultado={}; COMS.forEach(c=>{ a.resultado[c]=resumoRevisao(a,c); });
    a.revistoEm=r.id; a.revisaoFechada=true;
    await save('reunioes/'+a.id, a);
  }
  r.kpis={}; COMS.forEach(c=>{ const k=kpis(c); const w=S.dados.semanas?kpiSemanal(c):null; if(k||w) r.kpis[c]={...(k||{}), ...(w?{cl4:Math.round(w.cur.cl*10)/10, tk4:Math.round(w.cur.tk), v4:Math.round(w.cur.v), clLy:Math.round(w.ly.cl*10)/10, tkLy:Math.round(w.ly.tk)}:{})}; });
  const cpa=campanhaAtiva(); if(cpa) r.campanha={id:cpa.id,nome:cpa.nome,oferta:cpa.oferta||cpa.art,mec:cpa.mec,fim:cpa.fim};
  r.estado='fechada'; r.fechadoEm=new Date().toISOString();
  await saveReuniaoNow();
  if(!S.historico.find(h=>h.id===r.id)) S.historico.push(r);
  S.historico.sort((x,y)=>x.id<y.id?-1:1);
  render(); toast('Reunião fechada. Os resumos estão prontos.');
  }catch(e){ console.error(e); toast('Não foi possível fechar a reunião: '+(e&&e.message||'erro')); }
}
async function reabrir(){
  S.reuniao.estado='aberta'; delete S.reuniao.fechadoEm;
  S.historico=S.historico.filter(h=>h.id!==S.reuniao.id);
  await saveReuniaoNow(); render(); toast('Reunião reaberta.');
}

function waText(com){
  const r=S.reuniao, obs=r.objetivos.filter(o=>o.com===com);
  let t=`*${com} · Semana ${isoWeek(r.data)} (${semRange(r.data)})*\nObjetivos combinados hoje:\n\n`;
  obs.forEach((o,i)=>{ t+=`${i+1}. ${TIPO[o.tipo]} · ${o.nome}${o.ent?' ('+o.ent+')':''}\n`; if(factLine(o)) t+=`   ${factLine(o)}\n`; if(o.acao) t+=`   → ${o.acao}\n`; });
  if(S.anterior){ const x=resumoRevisao(S.anterior,com); if(x.n) t+=`\nSemana passada: ${x.cump} de ${x.n} cumpridos · ${eur0(x.rec)} recebidos`; }
  return t;
}
function anteriorDe(r){ const p=S.historico.filter(h=>h.id<r.id); return p.length?p[p.length-1]:null; }
async function download(who, rid){
  const r = rid ? (S.historico.find(h=>h.id===rid)||S.reuniao) : S.reuniao;
  const a = rid ? anteriorDe(r) : S.anterior;
  const html = who==='__rui'? htmlRui(r,a) : htmlComercial(who,r,a);
  const name = (who==='__rui'?'Equipa':who.replace('Ó','O'))+'_Semana'+isoWeek(r.data)+'.html';
  if(!S.dl){ toast('Os downloads não estão disponíveis nesta vista.'); return; }
  try{ await S.dl.save({filename:name, data:new Blob([html],{type:'text/html'})}); toast('Guardado: '+name); }
  catch(e){ if(e&&e.code==='declined') return; if(e&&e.code==='rate_limited'){ toast('Aguarda um momento e tenta outra vez.'); return; } toast('Não foi possível guardar o ficheiro.'); }
}

async function montarPDF(doc, rodape){
  const { jsPDF } = window.jspdf; const pdf = new jsPDF({unit:'mm', format:'a4', orientation:'portrait'});
  const M={l:10,r:10,t:10,b:14}, W=210-M.l-M.r, Hmax=297-M.b, GAP=3.5;
  const blocos=[];
  for(const el of doc.children){
    if(el.classList.contains('pb')){ blocos.push({pb:true}); for(const ch of el.children) blocos.push({el:ch, keep:true}); }
    else blocos.push({el, keep:el.classList.contains('parte')});
  }
  for(const b of blocos){ if(b.el){ b.cv = await window.html2canvas(b.el,{scale:2, backgroundColor:'#ffffff', logging:false, useCORS:true}); b.h = b.cv.height*W/b.cv.width; } }
  let y=M.t, pagina=1;
  const novaPagina=()=>{ pdf.addPage(); pagina++; y=M.t; };
  for(let i=0;i<blocos.length;i++){
    const b=blocos[i];
    if(b.pb){ if(y>M.t+0.1) novaPagina(); continue; }
    let need=b.h; if(b.keep && blocos[i+1] && blocos[i+1].h) need += GAP + Math.min(blocos[i+1].h, 40);
    if(y+need>Hmax && y>M.t+0.1) novaPagina();
    if(b.h <= Hmax-M.t){ pdf.addImage(b.cv.toDataURL('image/jpeg',0.92),'JPEG',M.l,y,W,b.h); y+=b.h+GAP; continue; }
    // bloco maior que uma página: fatiar
    const pxPorMm=b.cv.width/W; let off=0;
    while(off<b.cv.height){
      const disp=(Hmax-y)*pxPorMm; const alt=Math.min(disp, b.cv.height-off);
      const c=document.createElement('canvas'); c.width=b.cv.width; c.height=alt; c.getContext('2d').drawImage(b.cv,0,off,b.cv.width,alt,0,0,b.cv.width,alt);
      pdf.addImage(c.toDataURL('image/jpeg',0.92),'JPEG',M.l,y,W,alt/pxPorMm); off+=alt; y+=alt/pxPorMm+GAP;
      if(off<b.cv.height) novaPagina();
    }
  }
  const n=pdf.internal.getNumberOfPages();
  for(let i=1;i<=n;i++){ pdf.setPage(i); pdf.setFontSize(8); pdf.setTextColor(140); pdf.text(`${rodape} · página ${i} de ${n}`, 105, 290, {align:'center'}); }
  return pdf;
}
async function gerarPDF(quem){
  if(!S.dados){ toast('Carrega primeiro o Dados.xlsx.'); return; }

  const nome = quem==='Equipa' ? 'Equipa' : quem.replace('Ó','O');
  const filename = `${nome}_Semana${isoWeek(ref)}.pdf`;
  toast('A preparar o PDF de '+quem+'…', 10000);
  const host=document.createElement('div'); host.style.cssText='position:fixed;left:-10000px;top:0;background:#fff';
  host.innerHTML=`<style>${PDF_CSS}${CSS_V2}${CSS_V3}${CSS_V4}</style>`+(quem==='Equipa'?resumoEquipaDoc():resumoComercialDoc(quem));
  document.body.appendChild(host);
  try{
    await loadPdfLibs();
    if(document.fonts && document.fonts.ready) await document.fonts.ready;
    const pdf = await montarPDF(host.querySelector('#pdfdoc'), `Pão de Ló Ti'Piedade · ${quem==='Equipa'?'Equipa comercial':quem} · semana ${isoWeek(ref)}`);
    const blob = pdf.output('blob');
    if(!S.dl){ toast('Os downloads não estão disponíveis nesta vista.'); return; }
    await S.dl.save({filename, data:blob});
    toast('Guardado: '+filename);
  }catch(e){
    if(e&&e.code==='declined') return;
    if(e&&e.code==='rate_limited'){ toast('Aguarda um momento e tenta outra vez.'); return; }
    console.error(e); toast((e&&e.message)||'Não foi possível gerar o PDF.');
  }finally{ host.remove(); }
}

const pillVar = (a,b,sufixo='',inv=false) => { const x=relVar(a,b); if(x==null) return `<span class="pill neu">sem comparação</span>`; const good = inv ? x<0 : x>=0; return `<span class="pill ${good?'pos':'neg'}">${x>=0?'▲':'▼'} ${Math.abs(Math.round(x*100))}%${sufixo?' '+sufixo:''}</span>`; };
const heroVar = (a,b) => { const x=relVar(a,b); if(x==null) return ''; return `<span class="dl ${x>=0?'pos':'neg'}">${x>=0?'▲':'▼'} ${Math.abs(Math.round(x*100))}%</span>`; };
function barSvg(vals, labels, fmt){
  const W=340,H=150,pl=6,pr=6,pt=18,pb=20; const n=vals.length; const mx=Math.max(1,...vals); const bw=(W-pl-pr)/n*0.62; const step=(W-pl-pr)/n;
  return `<svg class="chart" viewBox="0 0 ${W} ${H}">${vals.map((v,i)=>{ const h=(H-pt-pb)*v/mx; const x=pl+i*step+(step-bw)/2, y=H-pb-h;
    return `<rect x="${x}" y="${y}" width="${bw}" height="${Math.max(h,1)}" rx="4" fill="${v===mx&&v>0?'#c9702e':'#e0b890'}"/>${v>0?`<text x="${x+bw/2}" y="${y-5}" text-anchor="middle" style="fill:#493631;font-weight:600">${fmt(v)}</text>`:''}<text x="${x+bw/2}" y="${H-6}" text-anchor="middle">${labels[i]}</text>`; }).join('')}</svg>`;
}
function lineSvg(series, labels, fmt){
  const W=340,H=150,pl=30,pr=8,pt=10,pb=20; const n=labels.length; const all=series.flatMap(s=>s.vals.filter(v=>v!=null)); const mx=Math.max(1,...all)*1.12;
  const x=i=>pl+(n<=1?0:i*(W-pl-pr)/(n-1)), y=v=>pt+(H-pt-pb)*(1-v/mx);
  const grid=[0,0.5,1].map(f=>{ const v=mx/1.12*f; return `<line x1="${pl}" x2="${W-pr}" y1="${y(v)}" y2="${y(v)}" stroke="#f1e8dd"/><text x="${pl-5}" y="${y(v)+3}" text-anchor="end">${fmt(v)}</text>`; }).join('');
  const lines=series.map(s=>{ const pts=s.vals.map((v,i)=>v==null?null:`${x(i)},${y(v)}`).filter(Boolean).join(' ');
    const area = s.area ? `<polygon points="${x(0)},${y(0)} ${pts} ${x(n-1)},${y(0)}" fill="${s.color}" opacity=".08"/>` : '';
    return area+`<polyline fill="none" stroke="${s.color}" stroke-width="${s.w||2.2}" ${s.dash?'stroke-dasharray="4 3"':''} stroke-linejoin="round" points="${pts}"/>`+(s.dots?s.vals.map((v,i)=>v==null?'':`<circle cx="${x(i)}" cy="${y(v)}" r="2.6" fill="#fff" stroke="${s.color}" stroke-width="1.6"/>`).join(''):''); }).join('');
  const xl=labels.map((l,i)=>(i%3===0||i===n-1)?`<text x="${x(i)}" y="${H-5}" text-anchor="middle">${l}</text>`:'').join('');
  return `<svg class="chart" viewBox="0 0 ${W} ${H}">${grid}${lines}${xl}</svg>`;
}
function donutSvg(parts){ // [{v,color,label}]
  const tot=parts.reduce((s,p)=>s+p.v,0)||1; let a=-Math.PI/2; const R=46,r=30,cx=60,cy=60;
  const arcs=parts.map(p=>{ const a2=a+2*Math.PI*p.v/tot; const large=a2-a>Math.PI?1:0;
    const d=`M${cx+R*Math.cos(a)},${cy+R*Math.sin(a)} A${R},${R} 0 ${large} 1 ${cx+R*Math.cos(a2)},${cy+R*Math.sin(a2)} L${cx+r*Math.cos(a2)},${cy+r*Math.sin(a2)} A${r},${r} 0 ${large} 0 ${cx+r*Math.cos(a)},${cy+r*Math.sin(a)} Z`; a=a2; return `<path d="${d}" fill="${p.color}"/>`; }).join('');
  return `<svg viewBox="0 0 120 120" width="120" height="120">${arcs}<text x="60" y="58" text-anchor="middle" style="font-family:Fraunces,Georgia,serif;font-size:15px;font-weight:600;fill:#2b1d18">${Math.round(parts[0].v/tot*100)}%</text><text x="60" y="72" text-anchor="middle" style="font-size:8.5px;fill:#8a7a70">${parts[0].label}</text></svg>`;
}

function pdfKpiTabela(com,g,titulo,cor){

function msgTexto(quem){
  const r=S.reuniao; const ref = r ? r.data : iso(new Date()); const sem=`semana ${isoWeek(ref)} (${semRange(ref)})`;
  if(quem==='Equipa'){
    let t=`Resumo da equipa comercial · ${sem}\n\n`;
    COMS.forEach(c=>{ const k=S.dados.semanas?kpiSemanal(c):null; const m=REL()?relK(c,'T','mes').v:null; const n=r?r.objetivos.filter(o=>o.com===c).length:0;

    return t+`\nO resumo completo segue em PDF.`;
  }
  const k=S.dados.semanas?kpiSemanal(quem):null; const obs=r?r.objetivos.filter(o=>o.com===quem):[];
  let t=`Olá ${quem}, segue o resumo da ${sem}.\n\n`;
  if(REL()){ const s=relK(quem,'T','semana'), m=relK(quem,'T','mes'); t+=`Faturação da semana: ${eur0(s.v)} · mês comercial: ${eur0(m.v)}\n`; }

  if(obs.length){ t+=`\nObjetivos desta semana:\n`; obs.forEach((o,i)=>{ t+=`${i+1}. ${TIPO[o.tipo]} · ${o.nome}${o.acao?' → '+o.acao:''}\n`; }); }

function aplicarResposta(){
  const a=S.anterior; if(!a) return;
  const txt=($('#respTxt')||{}).value||''; if(!txt.trim()){ toast('Cola primeiro a mensagem do comercial.'); return; }
  const m=txt.match(/Ponto de situação · (.+?) · semana/); const com = m ? m[1].trim() : S.com;
  const refM=txt.match(/ref (\d{4}-\d{2}-\d{2})/);
  if(refM && refM[1]!==a.id){ toast('Esta mensagem é de outra reunião ('+fmtDY(refM[1])+').',5000); return; }
  const obs=a.objetivos.filter(o=>o.com===com); if(!obs.length){ toast('Não há compromissos de '+com+' nessa reunião.'); return; }
  a.revisao=a.revisao||{}; let n=0;
  txt.split(/\n/).forEach(l=>{ const mm=l.match(/^\s*(✅|⬜|☑️|✔️|❌)\s*(\d+)\.\s*(.*)$/u); if(!mm) return;
    const o=obs[Number(mm[2])-1]; if(!o) return; const ok = mm[1]!=='⬜' && mm[1]!=='❌';
    const nota=(mm[3].split(' — ')[1]||'').trim();
    const auto=autoAvaliar(o,a); const cur=a.revisao[o.id]||{};
    if(auto.auto){ a.revisao[o.id]={...cur, motivo: (nota? 'Comercial: '+nota : cur.motivo||''), declarado: ok}; }
    else { a.revisao[o.id]={...cur, estado: ok?'cumprido':'nao', auto:false, motivo: nota||cur.motivo||'', declarado: ok}; }
    n++; });
  save('reunioes/'+a.id, a); S.com=com; S.showResp=false; render(); toast(n?`${n} compromissos atualizados a partir da mensagem de ${com}.`:'Não encontrei linhas marcadas com ✅ ou ⬜.');
}

function hbarSvg(items, fmt){ // [{label,v,hl}]
  const W=340, rowH=30, H=items.length*rowH+6, lw=70; const mx=Math.max(1,...items.map(i=>i.v));
  return `<svg class="chart" viewBox="0 0 ${W} ${H}">${items.map((it,i)=>{ const y=i*rowH+6; const w=(W-lw-70)*it.v/mx;
    return `<text x="0" y="${y+15}" style="fill:#2b1d18;font-weight:600;font-size:11px">${esc(it.label)}</text><rect x="${lw}" y="${y+3}" width="${Math.max(w,2)}" height="16" rx="5" fill="${it.hl?'#c9702e':'#e0b890'}"/><text x="${lw+w+6}" y="${y+15}" style="fill:#493631;font-weight:600">${fmt(it.v)}</text>`; }).join('')}</svg>`;
}
function periodoCard(com, g, k, h, titulo, destaque){
  const x=relK(com,g,k), y=relK(com,g,h); const md=x.cl?x.v/x.cl:0, mdy=y.cl?y.v/y.cl:0;
  const mini=(lab,a,b,f)=>`<tr><td>${lab}</td><td class="r"><b>${f(a)}</b></td><td class="r">${(()=>{const v=relVar(a,b); return v==null?'<span class="mu">—</span>':`<span class="${v>=0?'up':'dn'}">${v>=0?'▲':'▼'}${Math.abs(Math.round(v*100))}%</span>`;})()}</td></tr>`;
  return `<div class="pcard${destaque?' hl':''}"><div class="pt">${titulo}<span>${perTxt(k)}</span></div><b class="num">${eur0(x.v)}</b>${pillVar(x.v,y.v,'homólogo')}

}

function barSvg2(vals, counts, labels){
  const W=340,H=160,pl=6,pr=6,pt=26,pb=20; const n=vals.length; const mx=Math.max(1,...vals); const step=(W-pl-pr)/n; const bw=step*0.6;
  return `<svg class="chart" viewBox="0 0 ${W} ${H}">${vals.map((v,i)=>{ const h=(H-pt-pb)*v/mx; const x=pl+i*step+(step-bw)/2, y=H-pb-h;
    return `<rect x="${x}" y="${y}" width="${bw}" height="${Math.max(h,1)}" rx="4" fill="${v===mx&&v>0?'#c9702e':'#e0b890'}"/>${v>0?`<text x="${x+bw/2}" y="${y-14}" text-anchor="middle" style="fill:#2b1d18;font-weight:700">${Math.round(v).toLocaleString('pt-PT')} €</text><text x="${x+bw/2}" y="${y-4}" text-anchor="middle" style="font-size:8.5px">${counts[i]} venda${counts[i]===1?'':'s'}</text>`:''}<text x="${x+bw/2}" y="${H-6}" text-anchor="middle">${labels[i]}</text>`; }).join('')}</svg>`;
}
function gbarSvg(groups){ // [{label, a, b}] a=Horeca, b=Pingo Doce
  const W=340,H=170,pl=6,pr=6,pt=18,pb=20; const n=groups.length; const mx=Math.max(1,...groups.flatMap(g=>[g.a,g.b])); const step=(W-pl-pr)/n; const bw=step*0.3;
  return `<svg class="chart" viewBox="0 0 ${W} ${H}">${groups.map((g,i)=>{ const x0=pl+i*step+step*0.18; const ha=(H-pt-pb)*g.a/mx, hb=(H-pt-pb)*g.b/mx;
    return `<rect x="${x0}" y="${H-pb-ha}" width="${bw}" height="${Math.max(ha,1)}" rx="3" fill="#c9702e"/><rect x="${x0+bw+3}" y="${H-pb-hb}" width="${bw}" height="${Math.max(hb,1)}" rx="3" fill="#5f8358"/>
      <text x="${x0+bw/2}" y="${H-pb-ha-4}" text-anchor="middle" style="font-size:8.5px;fill:#2b1d18">${Math.round(g.a/1000)}k</text><text x="${x0+bw*1.5+3}" y="${H-pb-hb-4}" text-anchor="middle" style="font-size:8.5px;fill:#2b1d18">${Math.round(g.b/1000)}k</text>
      <text x="${x0+bw+1.5}" y="${H-6}" text-anchor="middle">${g.label}</text>`; }).join('')}</svg>`;
}

async function enviarComAnexos(quem, canal){
  if(!S.dados){ toast('Carrega primeiro o Dados.xlsx.'); return; }
  const sa=semanaAnalise(); const ref=sa?sa.seg:iso(new Date()); const nome=quem==='Equipa'?'Equipa':quem.replace('Ó','O');
  toast('A preparar os anexos…', 10000);
  let files=[];
  try{
    files.push(new File([await gerarPDFBlob(quem)], `${nome}_Semana${isoWeek(ref)}.pdf`, {type:'application/pdf'}));
  }catch(e){ console.error(e); toast('Não foi possível gerar o PDF.'); return; }

  try{

      toast('Enviado.'); return;
    }
  }catch(e){ if(e && e.name==='AbortError') return; console.warn('share falhou', e); }

  for(const f of files){ try{ await S.dl.save({filename:f.name, data:f}); }catch(e){ if(e&&e.code==='declined') return; } }
  abrirLink(canal==='mail'?linkEmail(quem):linkWhatsApp(quem), quem, canal);
  toast('Anexos guardados. Anexa-os à mensagem que abriu.', 6000);
}

/* colar vários pontos de situação de uma vez */
function aplicarResposta(){
  const a=S.anterior; if(!a) return;
  const txt=($('#respTxt')||{}).value||''; if(!txt.trim()){ toast('Cola primeiro a mensagem.'); return; }
  const partes = txt.split(/(?=Ponto de situação · )/).filter(p=>/Ponto de situação · /.test(p));
  if(!partes.length){ toast('Não encontrei nenhum "Ponto de situação" no texto.'); return; }
  a.revisao=a.revisao||{}; let n=0, outra=0; let ultimo=S.com;
  partes.forEach(bloco=>{
    const m=bloco.match(/Ponto de situação · (.+?) · semana/); const com = m ? m[1].trim() : null; if(!com||!COMS.includes(com)) return;
    const refM=bloco.match(/ref (\d{4}-\d{2}-\d{2})/); if(refM && refM[1]!==a.id){ outra++; return; }
    const obs=a.objetivos.filter(o=>o.com===com); ultimo=com;
    bloco.split(/\n/).forEach(l=>{ const mm=l.match(/^\s*(✅|⬜|☑️|✔️|❌)\s*(\d+)\.\s*(.*)$/u); if(!mm) return;
      const o=obs[Number(mm[2])-1]; if(!o) return; const ok = mm[1]!=='⬜' && mm[1]!=='❌';
      const nota=(mm[3].split(' — ')[1]||'').trim();
      const auto=autoAvaliar(o,a); const cur=a.revisao[o.id]||{};
      if(auto.auto){ a.revisao[o.id]={...cur, motivo:(nota?'Comercial: '+nota:cur.motivo||''), declarado:ok}; }
      else { a.revisao[o.id]={...cur, estado: ok?'cumprido':'nao', auto:false, motivo:nota||cur.motivo||'', declarado:ok}; }
      n++; });
  });
  save('reunioes/'+a.id, a); S.com=ultimo; S.showResp=false; render();
  toast(n?`${n} objetivos atualizados.${outra?' '+outra+' bloco(s) de outra reunião ignorados.':''}`:(outra?'O ponto de situação é de outra reunião.':'Não encontrei linhas marcadas com ✅ ou ⬜.'),5000);
}

/* ======== v6: vendas por loja (cruzamento com PD_entregas) ======== */
function lojasDoComercial(com){
  const D=S.dados.devol; const dev={}; const devFora={};
  (D.lojas||[]).forEach(x=>{ const o={loja:x[0],com:x[1],n6:x[2],v6:x[3],np:x[4],vp:x[5],ab:x[6],id:x[7],dw:x[8]||0}; if(o.id) dev[o.id]=o; else devFora[o.loja]=o; });
  const VL=D.vendasLoja||{};
  const mk=(id,com,zona,nome)=>{ const d=dev[id]||{n6:0,v6:0,np:0,vp:0,ab:0,dw:0}; const v=VL[id]||[nome,com,0,0,0,0,0,null];
    return {id:Number(id)||id, com, zona, loja:nome, n6:d.n6, dv6:d.v6, np:d.np, dvp:d.vp, ab:d.ab, dw:d.dw, v12:v[2], ent:v[3], v6:v[4], vp:v[5], vW:v[6], ult:v[7]}; };
  const lista = Object.entries(LOJAS_PD).filter(([id,v])=>com==='Equipa'||v[0]===com).map(([id,v])=>mk(id,v[0],v[1],v[2]));
  const fora = Object.entries(VL).filter(([id,v])=>!LOJAS_PD[id] && (com==='Equipa'||v[1]===com)).map(([id,v])=>mk(id,v[1],'Outras',v[0]));
  const foraDev = Object.values(devFora).filter(x=>com==='Equipa'||x.com===com);
  return {lista, fora, foraDev};
}
function paginaPingoDoce(com){
  const D=S.dados.devol; if(!D||!D.mes||!D.lojas||!D.lojas.length||D.lojas[0].length<9) return `<div class="al warn"><i>!</i><span>Carrega o Dados.xlsx outra vez para a análise Pingo Doce por loja.</span></div>`;
  const temVendas = D.vendasLoja && Object.keys(D.vendasLoja).length>0;
  const cs = com==='Equipa'?COMS:[com];
  const meses=[...new Set(cs.flatMap(c=>Object.keys(D.mes[c]||{})))].sort().slice(-12);
  const mv=m=>cs.reduce((a,c)=>{const e=(D.mes[c]||{})[m]||[0,0,0,0]; return [a[0]+e[0],a[1]+e[1],a[2]+e[2],a[3]+e[3]];},[0,0,0,0]);
  const M=meses.map(m=>({m,e:mv(m)})); const tot=M.reduce((a,x)=>[a[0]+x.e[0],a[1]+x.e[1],a[2]+x.e[2],a[3]+x.e[3]],[0,0,0,0]);
  const nomeMes=m=>['jan','fev','mar','abr','mai','jun','jul','ago','set','out','nov','dez'][Number(m.slice(5))-1];
  const atual=D.atualizado; const semDev = atual ? M.filter(x=>x.m>atual.slice(0,7)).map(x=>x.m) : [];
  const vendasComDev=M.filter(x=>!semDev.includes(x.m)).reduce((t,x)=>t+x.e[0],0); const taxa12 = vendasComDev ? tot[3]/vendasComDev : 0;
  const {lista, fora, foraDev} = lojasDoComercial(com);
  const zonas=[...new Set(lista.map(x=>x.zona))];
  const mesJ=relK(com,'J','mes'), mesJh=relK(com,'J','mesHom'), anoJ=relK(com,'J','ano'), anoJh=relK(com,'J','anoHom');
  const taxa = x => x.vW>0 ? x.dw/x.vW : null;
  const acima = lista.filter(x=>{const t=taxa(x); return t!=null && t>REL_PARAMS.devLim;}).length;
  const semVenda = lista.filter(x=>!x.v12).length;
  const linha = x => { const t=taxa(x); const tr = x.vp ? (x.v6-x.vp)/x.vp : null;
    return `<tr><td><b>${esc(x.loja)}</b> <span class="mu">${(x.id&&x.id!=='null'&&x.id!=='undefined')?x.id:''}</span></td>${com==='Equipa'?`<td>${x.com}</td>`:''}
      <td class="r">${x.ent||'<span class="mu">0</span>'}</td><td class="r"><b>${x.v12?eur0(x.v12):'<span class="mu">—</span>'}</b></td><td class="r">${x.ent?eur0(x.v12/x.ent):''}</td>
      <td class="r">${tr==null?'':`<span class="${tr>=0?'up':'dn'}">${tr>=0?'▲':'▼'}${Math.abs(Math.round(tr*100))}%</span>`}</td>
      <td class="r">${x.dw?eur0(x.dw):'<span class="mu">0 €</span>'}</td>
      <td class="r">${t==null?'<span class="mu">—</span>':`<span class="pill ${t>REL_PARAMS.devLim?'neg':t>REL_PARAMS.devLim*0.6?'neu':'pos'}" style="margin:0">${(t*100).toFixed(1)}%</span>`}</td>
      <td class="r">${x.ult?fmtD(x.ult):'<span class="mu">—</span>'}</td><td class="r">${x.ab||''}</td></tr>`; };
  const ordenar = arr => arr.sort((a,b)=>(b.v12-a.v12) || a.loja.localeCompare(b.loja));
  const blocos = com==='Equipa'
    ? [{t:'Lojas com maior taxa de devolução', rows:lista.filter(x=>taxa(x)!=null).sort((a,b)=>taxa(b)-taxa(a)).slice(0,25)}]
    : zonas.map(z=>({t:z, rows:ordenar(lista.filter(x=>x.zona===z))})).concat(fora.length?[{t:'Outras lojas com entregas (fora da lista)', rows:ordenar(fora)}]:[]);
  const head=`<tr><th>Loja</th>${com==='Equipa'?'<th>Comercial</th>':''}<th class="r">Entregas</th><th class="r">Vendas 12 m</th><th class="r">Média/entrega</th><th class="r">Últ. 6 m vs ant.</th><th class="r">Devoluções</th><th class="r">Taxa</th><th class="r">Última entrega</th><th class="r">Abertas</th></tr>`;
  const jan = D.janela ? `${fmtDY(D.janela[0])} a ${fmtDY(D.janela[1])}` : '';
  return `<div class="cl"><div class="dash5" style="margin-top:0">
    <div class="kbox" style="border-left-color:#5f8358"><b class="num">${eur0(mesJ.v)}</b><span>vendas Pingo Doce · mês</span>${pillVar(mesJ.v,mesJh.v,'homólogo')}</div>
    <div class="kbox"><b class="num">${eur0(anoJ.v)}</b><span>vendas Pingo Doce · ano</span>${pillVar(anoJ.v,anoJh.v,'homólogo')}</div>
    <div class="kbox"><b class="num">${eur0(mediaPD(com,'mes'))}</b><span>média por venda · ${mesJ.docs} vendas no mês</span>${pillVar(mediaPD(com,'mes'),mediaPD(com,'mesHom'),'homólogo')}</div>
    <div class="kbox ${taxa12>REL_PARAMS.devLim?'r':'g'}"><b class="num">${(taxa12*100).toFixed(1)}%</b><span>taxa de devolução 12 meses · limite 5%</span></div>
    <div class="kbox ${acima?'r':'g'}"><b class="num">${temVendas?acima:'—'}</b><span>lojas acima de 5% de devolução${temVendas&&semVenda?' · '+semVenda+' sem entregas em 12 m':''}</span></div>
  </div></div>
  <div class="sec cl"><div class="panel" style="padding:9px"><div class="ptitle">Vendas e devoluções por mês<span>${atual?'devoluções registadas até '+fmtDY(atual):''}</span></div>
    <div class="tw"><table><thead><tr><th>Mês</th>${M.map(x=>`<th class="r">${nomeMes(x.m)}</th>`).join('')}<th class="r">Total</th></tr></thead><tbody>
      <tr><td>Vendas</td>${M.map(x=>`<td class="r">${Math.round(x.e[0]/100)/10}k</td>`).join('')}<td class="r"><b>${eur0(tot[0])}</b></td></tr>
      <tr><td>Nº vendas</td>${M.map(x=>`<td class="r">${x.e[1]}</td>`).join('')}<td class="r"><b>${tot[1]}</b></td></tr>
      <tr><td>Devoluções</td>${M.map(x=>`<td class="r">${semDev.includes(x.m)?'<span class="mu">n/d</span>':eur0(x.e[3])}</td>`).join('')}<td class="r"><b>${eur0(tot[3])}</b></td></tr>
      <tr><td>Taxa</td>${M.map(x=>{ if(semDev.includes(x.m)) return '<td class="r"><span class="mu">—</span></td>'; const t=x.e[0]?x.e[3]/x.e[0]:0; return `<td class="r ${t>REL_PARAMS.devLim?'dn':''}">${(t*100).toFixed(1)}%</td>`; }).join('')}<td class="r"><b>${(taxa12*100).toFixed(1)}%</b></td></tr>
    </tbody></table></div></div></div>
  <div class="sec cl"><div class="sech">${com==='Equipa'?'Lojas Pingo Doce':'As tuas lojas Pingo Doce'}<small>${lista.length} lojas · vendas, devoluções e taxa por loja</small></div></div>
  ${blocos.map(b=>`<div class="sec cl" style="margin-top:6px"><div class="lh">${esc(b.t)} <span class="mu" style="font-weight:500">· ${b.rows.length} lojas</span></div><div class="tw"><table><thead>${head}</thead><tbody>${b.rows.map(linha).join('')}</tbody></table></div></div>`).join('')}
  <div class="note cl">${temVendas?`Loja de cada venda identificada pela aba PD_entregas (${D.cobertura!=null?Math.round(D.cobertura*100)+'% do valor faturado nos últimos 12 meses':'—'}). Taxa por loja = devoluções ÷ vendas no mesmo período (${jan}), porque as devoluções só estão registadas até ${fmtDY(atual)}.`:'Sem a aba PD_entregas não é possível saber a loja de cada venda.'}${foraDev.length?` Devoluções de lojas fora da lista: ${foraDev.length} lojas.`:''}</div>`;
}


/* ---------- cópia de segurança (migração Claude → portal) ---------- */
async function exportarTudo(){
  if(!S.db){ toast('Sem armazenamento disponível.'); return; }
  toast('A preparar a cópia…',8000);
  const docs={};
  for(const p of ['dados/atual','dados/rel','config/tipos','config/contactos']){ try{ const d=await S.db.doc(p).get(); if(d.exists) docs[p]=clone(d.data()); }catch(e){} }
  for(const c of ['reunioes','campanhas']){ try{ const r=await S.db.collection(c).get(); r.docs.forEach(x=>{ const v=clone(x.data()); const id=v.id||x.id; if(id) docs[c+'/'+id]=v; }); }catch(e){} }
  const blob=new Blob([JSON.stringify({app:'tipiedade-reuniao',versao:1,exportado:new Date().toISOString(),docs})],{type:'application/json'});
  const fn=`reuniao-copia-${iso(new Date())}.json`;
  if(S.dl){ try{ await S.dl.save({filename:fn,data:blob}); toast('Cópia guardada: '+fn); }catch(e){ if(!(e&&e.code==='declined')) toast('Não foi possível guardar.'); } }
}
async function importarTudo(file){
  try{
    const j=JSON.parse(await file.text()); if(!j||!j.docs) throw new Error('Ficheiro inválido');
    const ps=Object.keys(j.docs); for(const p of ps){ await save(p, j.docs[p]); }
    await saveChain; await loadAll(); render(); toast(`Cópia importada: ${ps.length} registos.`,5000);
  }catch(e){ console.error(e); toast('Não foi possível importar: '+(e.message||e)); }
}
/* ---------- no portal: publicar objetivos diretamente no CRM ---------- */
async function publicarNoCRMDireto(){
  const P=window.__PORTAL; const code=codigoCRM(); if(!code){ toast('Define primeiro os objetivos da semana.'); return; }
  const t=P.sess(); if(!t){ toast('Sessão do portal expirada. Entra outra vez.'); return; }
  const r=S.reuniao; const novo={ ref:r.id, semana:isoWeek(r.data), range:semRange(r.data), reuniao:fmtDY(r.data), publicado:new Date().toISOString(), comerciais:{} };
  COMS.forEach(c=>{ novo.comerciais[COM_USER[c]] = r.objetivos.filter(o=>o.com===c).map((o,i)=>({n:i+1, tipo:TIPO[o.tipo], t:o.tipo, nome:o.nome, acao:o.acao||'', ok:false, nota:''})); });
  try{
    let sha=null; const g=await fetch(P.W+'/contents/objetivos.json',{headers:{Authorization:'Bearer '+t},cache:'no-store'}); if(g.ok){ sha=(await g.json()).sha; }
    const b=new TextEncoder().encode(JSON.stringify(novo,null,2)); let bin=''; b.forEach(x=>bin+=String.fromCharCode(x));
    const body={message:`Objetivos: semana ${novo.semana} publicada`, content:btoa(bin)}; if(sha) body.sha=sha;
    const u=await fetch(P.W+'/contents/objetivos.json',{method:'PUT',headers:{Authorization:'Bearer '+t,'Content-Type':'application/json'},body:JSON.stringify(body)});
    if(!u.ok) throw new Error('HTTP '+u.status);
    toast('Objetivos publicados no CRM. Os comerciais já os veem.',5000);
  }catch(e){ console.error(e); toast('Não foi possível publicar: '+(e.message||e)); }
}

  const b = e.target.closest('button'); if(!b) return;
  if(b.dataset.v){ S.view=b.dataset.v; if(S.view==='historico') S.histSel=null; render(); window.scrollTo(0,0); return; }
  if(b.dataset.go){ S.view=b.dataset.go; render(); window.scrollTo(0,0); return; }
  if(b.dataset.com){ S.com=b.dataset.com; render(); return; }
  if(b.dataset.tab){ S.sugTab=b.dataset.tab; render(); return; }
  if(b.dataset.add){ addFromClient(b.dataset.add, b.dataset.ent); return; }
  if(b.dataset.carry){ carry(b.dataset.carry); return; }
  if(b.dataset.del){ S.reuniao.objetivos=S.reuniao.objetivos.filter(o=>o.id!==b.dataset.del); saveReuniaoSoon(); render(); return; }
  if(b.dataset.rev){ setRev(b.dataset.rev, b.dataset.st); return; }
  if(b.dataset.dl){ download(b.dataset.dl, b.dataset.rid); return; }
  if(b.dataset.pdf){ gerarPDF(b.dataset.pdf); return; }

  if(b.dataset.html){ descarregarHTML(b.dataset.html); return; }

  if(b.dataset.open!==undefined){ S.histSel=b.dataset.open||null; render(); window.scrollTo(0,0); return; }
  if(b.dataset.wa){ enviarComAnexos(b.dataset.wa, 'wa'); return; }
  if(b.dataset.kcom){ S.kCom=b.dataset.kcom; render(); return; }

  if(act==='addLead') addLead();
  else if(act==='newCamp'){ S.campForm=true; render(); }

  else if(act==='fechar') fecharReuniao(false);

  else if(act==='cancelFechar'){ S.confirmFechar=false; S.view='objetivos'; render(); window.scrollTo(0,0); }

});
