name: Leads Semanais Ti'Piedade

on:
  schedule:
    - cron: '30 6 * * 1'   # segunda-feira 06:30 UTC
    - cron: '30 6 * * 3'   # quarta-feira  06:30 UTC
  workflow_dispatch:
    inputs:
      modo:
        description: 'coordenador ou comerciais'
        required: false
        default: 'comerciais'

jobs:
  segunda-coordenador:
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'schedule' && contains(github.event.schedule, '* * 1'))
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install openpyxl requests
      - name: Correr script (coordenador)
        env:
          MODO: coordenador
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          BREVO_API_KEY: ${{ secrets.BREVO_API_KEY }}
          EMAIL_NUNO:  ${{ secrets.EMAIL_NUNO }}
          EMAIL_JOAO:  ${{ secrets.EMAIL_JOAO }}
          EMAIL_OSCAR: ${{ secrets.EMAIL_OSCAR }}
          EMAIL_RUI:   ${{ secrets.EMAIL_RUI }}
        run: python scripts/generate_leads.py

  quarta-comerciais:
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'schedule' && contains(github.event.schedule, '* * 3'))
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install openpyxl requests
      - name: Correr script (comerciais)
        env:
          MODO: ${{ github.event.inputs.modo || 'comerciais' }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          BREVO_API_KEY: ${{ secrets.BREVO_API_KEY }}
          EMAIL_NUNO:  ${{ secrets.EMAIL_NUNO }}
          EMAIL_JOAO:  ${{ secrets.EMAIL_JOAO }}
          EMAIL_OSCAR: ${{ secrets.EMAIL_OSCAR }}
          EMAIL_RUI:   ${{ secrets.EMAIL_RUI }}
        run: python scripts/generate_leads.py
